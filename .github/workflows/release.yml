name: Release

on:
  release:
    types:
      - created
  # redeploy the website from the Actions tab without making a release
  workflow_dispatch:

# read only unless a job asks for more
permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  web:
    name: Web Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install
      run: npm ci

    - name: Test
      run: npm test

    - name: Build
      run: npm run build-web

    # the README screenshots and the share image, which the deploy then
    # includes; a failure here shouldn't stop the release going out
    - name: Install the screenshot browser
      continue-on-error: true
      run: npx playwright install --with-deps chromium

    - name: Screenshots
      id: screenshots
      continue-on-error: true
      run: npm run screenshots

    - name: Upload screenshots
      if: steps.screenshots.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: |
          README/*.png
          public/social.png

    - name: Deploy over SFTP
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        # user@host for the hosting account (host must match the pinned keys below)
        TARGET: ${{ secrets.DEPLOY_TARGET }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # pinned host keys for ftp.garethnunns.com (oxygen.primexeon.com)
        cat > ~/.ssh/known_hosts <<'KEYS'
        ftp.garethnunns.com ssh-rsa 
        ftp.garethnunns.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBN30lB13gjM1ZvTkcHmRpKJ11WZtCkW0nuJ3QDvvCk/bqwAOSNfL6TPoaEVw3/rxq9rny1FqBJrVT1tXzUbaTZk=
        ftp.garethnunns.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKp/yA5CEowbsB9VFT5sKJW/Yj3fcdsqdcOt1DkpGIZy
        KEYS
        scripts/sftp-batch.sh web-build e2 > batch.txt
        sftp -b batch.txt -i ~/.ssh/deploy_key \
          -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TARGET"

  # a PR with the new screenshots, if they changed
  screenshots:
    name: Screenshots PR
    needs: web
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Download screenshots
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v7
      with:
        name: screenshots

    - name: Open a PR if they changed
      if: steps.download.outcome == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ github.event.release.tag_name || github.run_number }}
        BASE: ${{ github.event.repository.default_branch }}
      run: |
        if git diff --quiet -- README public/social.png; then
          echo "Screenshots unchanged"
          exit 0
        fi
        branch="screenshots-$VERSION"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$branch"
        git add README/*.png public/social.png
        git commit -m "Screenshots for $VERSION"
        git push -u origin "$branch"
        gh pr create --base "$BASE" --head "$branch" \
          --title "Screenshots for $VERSION" \
          --body "README screenshots and the share image, retaken from the $VERSION build by the release workflow. The share image is already live; this keeps the repo in step."

  desktop:
    name: Desktop Release
    if: github.event_name == 'release'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build-desktop

      - name: Copy to artifacts
        shell: bash
        run: |
          mkdir artifacts
          mv dist/*.dmg dist/*.AppImage dist/*.exe artifacts 2>/dev/null || true
          ls artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "artifacts/**"

  # the Generative Noise store (store.generativenoise.com) reads the latest release from
  # here as it builds: once the downloads are on it, it's told to build again
  store:
    name: Rebuild the store
    needs: desktop
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the store
        run: |
          if [ -z "$STORE_DEPLOY_HOOK" ]; then
            echo "::warning::No STORE_DEPLOY_HOOK secret, so the store shows this release once it's next built"
            exit 0
          fi
          curl -fsS -X POST "$STORE_DEPLOY_HOOK" > /dev/null
        env:
          STORE_DEPLOY_HOOK: ${{ secrets.STORE_DEPLOY_HOOK }}
