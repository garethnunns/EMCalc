name: Release

on:
  release:
    types:
      - created

env:
  NODE_VERSION: '24.x'

jobs:
  web:
    name: Web Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: yarn

    - name: Install
      run: yarn install --frozen-lockfile

    - name: Test
      run: yarn test

    - name: Build
      run: yarn build-web

    - name: gn deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ftp.garethnunns.com
        username: e2@garethnunns.com
        password: ${{ secrets.gn_ftp_password }}
        local-dir: ./web-build/

  desktop:
    name: Desktop Release

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build-desktop

      - name: Copy to artifacts
        shell: bash
        run: |
          mkdir artifacts
          mv dist/*.zip dist/*.AppImage dist/*.exe artifacts 2>/dev/null || true
          ls artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "artifacts/**"
